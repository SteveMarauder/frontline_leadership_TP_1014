</head>
<body>
  <header>
    <div class="wrap masthead">
      <div><p class="eyebrow">第一線主管培訓</p><h1>Frontline Leadership</h1><p>課程簽到與學習問卷</p></div>
      <div class="session">TP 場次<strong>10 / 15</strong></div>
    </div>
  </header>
  <div class="wrap" style="padding-top:18px;display:flex;align-items:center;gap:12px"><img src="course.png" alt="" width="44" height="44"><span style="font-size:13px;color:#637068">TP 1015 · 學習與成長</span></div>
  <main class="wrap">
    <a class="feature" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=BR5qs2JKK0SDz9vdbXgQ5J56xKD-eV5GgKH8ElyQp3BUMTBKVUJFMVhJR0ZEUVdDTTNUM1REN0tTTS4u" target="_blank" rel="noopener noreferrer" aria-label="課程簽到，於新分頁開啟"><span class="symbol" aria-hidden="true">✓</span><div><div class="subtitle">CHECK-IN</div><strong>課程簽到</strong></div><span class="arrow" aria-hidden="true">↗</span></a>
    <div class="section-head"><h2>章節問卷</h2><span class="count">9 個章節</span></div>
    <div class="grid" id="chapters"></div>
    <div class="section-head"><h2>課程回顧</h2><span class="count">FINAL REFLECTION</span></div>
    <a class="feature reflection" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=BR5qs2JKK0SDz9vdbXgQ5J56xKD-eV5GgKH8ElyQp3BUMDlWNllDRDNPQVYyNVZJRlc2U09BTVJFUi4u" target="_blank" rel="noopener noreferrer" aria-label="最終反思，於新分頁開啟"><span class="symbol" aria-hidden="true">◎</span><div><div class="subtitle">FINAL REFLECTION</div><strong>最終反思</strong></div><span class="arrow" aria-hidden="true">↗</span></a>
    <footer><span>Frontline Leadership · TP 1015</span><span>Microsoft Forms</span></footer>
  </main>
  <script>
    const prefix = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=BR5qs2JKK0SDz9vdbXgQ5J56xKD-eV5GgKH8ElyQp3BU';
    const chapters = [
      ['團隊投入度','NjBUSTZEQTdSTkFYVUZTWTBNUUM4ODdBSi4u'],
      ['建立信任','OVNFMUs0RFc0WFRMS1UxSjhYMVdMN1lXRy4u'],
      ['獲得共識','Q1JPM1ZVSkY2OUdGWEMyOEZPQTRXSkEyUy4u'],
      ['積極聆聽','NTZDRlUxWjdTTTBTTE44UzNYNExOMlZPNC4u'],
      ['衝突管理','QU8ySzlMUkZYRUQzOExVSTZMSUJQSzc4Qy4u'],
      ['表揚與感謝','ODlHUllYSUExOFlGUjJJUjBTTjdZMk40VC4u'],
      ['自我覺察','QUNMQVQ5TkdOVVJJSE5NQUcwTlRWRDU2Wi4u'],
      ['績效與發展','MzFUVVREQUQ1MFk4UklCT0ZCQzNENERTUC4u'],
      ['從同儕變主管','OFhKWENFMVU0TTZONUZISjhVRklMMlE1Ni4u']
    ];
    const container = document.getElementById('chapters');
    chapters.forEach(([title,id],index) => {
      const link = document.createElement('a');
      link.className = 'question';
      link.href = prefix + id;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.setAttribute('aria-label', `Chapter ${index+1} ${title}，於新分頁開啟`);
      link.innerHTML = `<span class="number" aria-hidden="true">${String(index+1).padStart(2,'0')}</span><span class="label"><small>CHAPTER ${index+1}</small><strong>${title}</strong></span><span class="arrow" aria-hidden="true">↗</span>`;
      container.appendChild(link);
    });
  </script>
</body>
</html>
